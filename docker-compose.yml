services:
  couchdb:
    image: couchdb:3.3
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?define COUCHDB_PASSWORD en .env}
    ports: ["5984:5984"]
    volumes: ["couch_data:/opt/couchdb/data"]

  api:
    build: .
    depends_on: [couchdb]
    environment:
      BIND_ADDR: 0.0.0.0:8080
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
      COUCHDB_DB: ${COUCHDB_DB:-reparto}
      COUCHDB_REPLICATION_PEER_URL: ${COUCHDB_REPLICATION_PEER_URL:-}
      COUCHDB_REPLICATION_PEER_USER: ${COUCHDB_REPLICATION_PEER_USER:-}
      COUCHDB_REPLICATION_PEER_PASSWORD: ${COUCHDB_REPLICATION_PEER_PASSWORD:-}
      RUST_LOG: info
    ports: ["8081:8080"]

volumes:
  couch_data:
